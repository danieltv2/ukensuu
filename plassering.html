<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A4 Aspect Ratio Container</title>
  <style>
    /* GENERAL STYLES */
    html, body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      display: flex; /* Use flex to center content */
      justify-content: center;
      align-items: center;
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      gap: 1rem;
      overflow: hidden; /* Prevent layout issues on smaller screens */
      box-sizing: border-box;
    }

    /* A4 CONTAINER */
    .a4-container {
      position: relative;
      background-color: white;
      border: 2px solid #333;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;

      /* Dynamically calculate width/height based on the limiting factor (viewport width or height) */
      width: calc(100vh * (210 / 297)); /* Use full viewport height for horizontal screens */
      height: calc(100vw * (297 / 210)); /* Use full viewport width for vertical screens */
      max-width: 100vw; /* For wider screens, cap the width to viewport width */
      max-height: 100vh; /* For taller screens, cap the height to viewport height */
      aspect-ratio: 210 / 297; /* Ensures the A4 aspect ratio */
    }

    /* TEXT BOX */
    .text-box {
      position: absolute;
      background-color: #4caf50;
      color: white;
      border-radius: 4px;
      text-align: center;
      padding: 0.5rem;
      transform: translate(-50%, -50%);
      max-width: 50%; /* Prevent the box from being too wide */
      transition: left 0.2s ease, top 0.2s ease;
    }

    /* CONTROLS SECTION */
    .controls {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      width: 100%;
      box-sizing: border-box;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .input-group label {
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .input-group input {
      width: 4rem;
      padding: 0.5rem;
      text-align: center;
      font-size: 1rem;
    }

    button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- A4 Container -->
    <div class="a4-container" id="a4-container">
      <!-- Text Box -->
      <div class="text-box" id="text-box">Your Text</div>
    </div>

    <!-- Controls Section -->
    <div class="controls">
      <div class="input-group">
        <label for="horizontal-position">Horizontal (%)</label>
        <input
          type="number"
          id="horizontal-position"
          value="50"
          min="0"
          max="100"
        />
      </div>
      <div class="input-group">
        <label for="vertical-position">Vertical (%)</label>
        <input
          type="number"
          id="vertical-position"
          value="50"
          min="0"
          max="100"
        />
      </div>
      <button onclick="updatePosition()">Update Position</button>
    </div>
  </div>

  <script>
    const textBox = document.getElementById("text-box");
    const a4Container = document.getElementById("a4-container");

    function updatePosition() {
      // Get input values
      const horizontalInput = parseFloat(document.getElementById("horizontal-position").value);
      const verticalInput = parseFloat(document.getElementById("vertical-position").value);

      // Clamp values to keep the text box within the container
      const clampedHorizontal = Math.min(Math.max(horizontalInput, 0), 100);
      const clampedVertical = Math.min(Math.max(verticalInput, 0), 100);

      // Update text box position
      textBox.style.left = `${clampedHorizontal}%`;
      textBox.style.top = `${clampedVertical}%`;
      textBox.style.transform = "translate(-50%, -50%)"; // Keep the box properly centered
    }

    // Initialize the text box's position
    updatePosition();
  </script>
</body>
</html>
