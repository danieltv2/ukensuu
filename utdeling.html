
                        <!DOCTYPE html>
                        <html lang="en">
                        <head>
                            <meta charset="UTF-8">
                            <meta name="viewport" content="width=device-width, initial-scale=1.0">
							<style>
								body {
									background-color: white; /* Ensure the iframe has a white background */
								}

								
							</style>
                        </head>
                        <body>
                            <!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Min side</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f1b2d; color: #fff; min-height: 100vh; }

    /* ══ TOP NAV ══ */
    .top-nav {
      background: #0f1b2d; border-bottom: 1px solid #1e2e45;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 60px; position: sticky; top: 0; z-index: 50;
    }
    .top-nav-left { display: flex; align-items: center; gap: 12px; }
    .home-btn {
      width: 40px; height: 40px; border-radius: 50%; background: #1e2e45;
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff;
    }
    .back-btn {
      display: flex; align-items: center; gap: 6px; background: #fff; color: #0f1b2d;
      border: none; border-radius: 20px; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .top-nav-right { display: flex; align-items: center; gap: 12px; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 50%; background: transparent;
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff;
    }
    .user-btn {
      display: flex; align-items: center; gap: 8px; background: transparent;
      border: none; cursor: pointer; color: #fff; font-size: 14px; font-weight: 600;
    }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%; background: #4a6cf7;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; flex-shrink: 0;
    }

    /* ══ PAGE HEADER ══ */
    .page-header { text-align: center; padding: 36px 24px 24px; }
    .page-title { display: inline-flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 700; }
    .page-title .avatar { width: 42px; height: 42px; font-size: 15px; }

    /* ══ MAIN TABS ══ */
    .main-tabs { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 0 24px 28px; }
    .main-tab {
      display: flex; align-items: center; gap: 8px; padding: 10px 22px; border-radius: 24px;
      border: 1.5px solid #2a3d58; background: transparent;
      color: #b0c4de; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .main-tab:hover { border-color: #4a6cf7; color: #fff; }
    .main-tab.active { background: #fff; color: #0f1b2d; border-color: #fff; }

    /* ══ CONTENT WRAPPER ══ */
    .delt-content { padding: 0 32px 60px; max-width: 1400px; margin: 0 auto; }

    /* ══ SUB-TABS ══ */
    .sub-tabs { display: flex; border-bottom: 2px solid #1e2e45; }
    .sub-tab {
      padding: 10px 26px; font-size: 15px; font-weight: 600;
      color: #b0c4de; background: transparent; border: none;
      cursor: pointer; position: relative; transition: color .2s;
    }
    .sub-tab::after {
      content: ''; position: absolute; bottom: -2px; left: 0; right: 0;
      height: 3px; background: #4a6cf7; border-radius: 2px 2px 0 0; opacity: 0; transition: opacity .2s;
    }
    .sub-tab.active { color: #fff; }
    .sub-tab.active::after { opacity: 1; }
    .sub-tab:hover { color: #fff; }

    /* ══ TAB PANELS ══ */
    .tab-panel { display: none; padding-top: 24px; }
    .tab-panel.active { display: block; }

    /* ══ BUTTONS ══ */
    .action-row { display: flex; justify-content: center; margin-bottom: 24px; }
    .primary-btn {
      display: flex; align-items: center; gap: 8px; padding: 10px 24px; border-radius: 24px;
      border: 1.5px solid #b0c4de; background: transparent;
      color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .primary-btn:hover { border-color: #fff; background: #1e2e45; }
    .primary-btn.accent { border-color: #4a6cf7; color: #4a6cf7; }
    .primary-btn.accent:hover { background: #1e2e45; border-color: #6a8cf9; color: #6a8cf9; }

    /* ══ OPPGAVER FILTERS ══ */
    .filter-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
    .filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-tab {
      padding: 8px 18px; border-radius: 20px; border: 1.5px solid #2a3d58; background: transparent;
      color: #b0c4de; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .filter-tab:hover { border-color: #4a6cf7; color: #fff; }
    .filter-tab.active { background: #4a6cf7; border-color: #4a6cf7; color: #fff; }
    .filter-right { display: flex; align-items: center; gap: 10px; }
    .search-box {
      display: flex; align-items: center; gap: 8px; background: #1e2e45;
      border: 1.5px solid #2a3d58; border-radius: 20px; padding: 8px 14px; min-width: 220px;
    }
    .search-box input { background: transparent; border: none; outline: none; color: #b0c4de; font-size: 13px; flex: 1; }
    .search-box input::placeholder { color: #6080a0; }
    .sort-btn {
      display: flex; align-items: center; gap: 6px; background: #1e2e45;
      border: 1.5px solid #2a3d58; border-radius: 20px; padding: 8px 14px;
      color: #b0c4de; font-size: 13px; font-weight: 600; cursor: pointer;
    }

    /* ══ OPPGAVER CARD GRID ══ */
    .card-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
    @media(max-width:1000px){ .card-grid{ grid-template-columns:repeat(2,1fr); } }
    @media(max-width:640px) { .card-grid{ grid-template-columns:1fr; } }
    .card { background: #fff; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; color: #0f1b2d; }
    .card-top { display: flex; align-items: stretch; flex: 1; }
    .card-img { width: 150px; flex-shrink: 0; overflow: hidden; }
    .card-img-ph { width: 100%; height: 100%; min-height: 120px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
    .card-body { flex: 1; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 6px; }
    .card-badge { align-self: flex-end; display: flex; align-items: center; gap: 4px; font-size: 12px; color: #555; font-weight: 500; }
    .card-title { font-size: 15px; font-weight: 700; }
    .card-meta { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #555; }
    .card-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 8px 12px 12px; }
    .card-action-btn {
      width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid #cdd;
      background: transparent; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: #555; transition: all .2s;
    }
    .card-action-btn:hover { background: #f0f4ff; border-color: #4a6cf7; color: #4a6cf7; }
    .card-action-btn svg { width: 15px; height: 15px; }

    /* ══ ELEVFORSIDER TOOLBAR ══ */
    .ef-toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    .view-toggle { display: flex; background: #1e2e45; border-radius: 22px; padding: 4px; gap: 2px; }
    .view-btn {
      display: flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 18px;
      border: none; background: transparent; color: #b0c4de; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all .2s;
    }
    .view-btn.active { background: #fff; color: #0f1b2d; }
    .view-panel { display: none; }
    .view-panel.active { display: block; }

    /* ══ ALL ELEVFORSIDER LIST ══ */
    .ef-list { display: flex; flex-direction: column; gap: 12px; }
    .ef-list-item {
      display: flex; align-items: stretch; background: #fff;
      border-radius: 14px; overflow: hidden; color: #0f1b2d;
      transition: box-shadow .2s;
    }
    .ef-list-item:hover { box-shadow: 0 4px 20px #0009; }
    .ef-list-stripe { width: 6px; flex-shrink: 0; }
    .ef-list-img { width: 88px; flex-shrink: 0; overflow: hidden; }
    .ef-list-img-ph { width: 100%; height: 100%; min-height: 80px; display: flex; align-items: center; justify-content: center; font-size: 26px; }
    .ef-list-body { flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 5px; justify-content: center; }
    .ef-list-title { font-size: 15px; font-weight: 700; }
    .ef-list-meta { font-size: 12px; color: #666; display: flex; gap: 14px; flex-wrap: wrap; }
    .ef-list-badge { padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; }
    .ef-list-actions { display: flex; align-items: center; gap: 8px; padding: 0 16px; flex-shrink: 0; }

    /* "Bruk som elevforside" button */
    .bruk-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 10px;
      background: #4a6cf7; border: none;
      color: #fff; font-size: 12px; font-weight: 700;
      cursor: pointer; white-space: nowrap; transition: all .2s;
    }
    .bruk-btn:hover { background: #3a5ce7; box-shadow: 0 2px 12px #4a6cf744; }
    .bruk-btn svg { width: 14px; height: 14px; }

    /* ══ CALENDAR STYLES ══ */
    .cal-layout { display: grid; grid-template-columns: 250px 1fr; gap: 20px; align-items: start; }
    @media(max-width:820px){ .cal-layout{ grid-template-columns:1fr; } }

    .mini-month { background: #162236; border-radius: 14px; padding: 16px; position: sticky; top: 80px; }
    .mini-month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .mini-month-title { font-size: 14px; font-weight: 700; }
    .mini-nav-btn {
      width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid #2a3d58;
      background: transparent; color: #b0c4de; display: flex; align-items: center;
      justify-content: center; cursor: pointer; transition: all .2s;
    }
    .mini-nav-btn:hover { border-color: #4a6cf7; color: #fff; }
    .mini-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
    .mini-dow { text-align: center; font-size: 10px; font-weight: 700; color: #4a6070; text-transform: uppercase; padding-bottom: 6px; letter-spacing: .04em; }
    .mini-cell {
      text-align: center; font-size: 12px; font-weight: 500; width: 30px; height: 30px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: #b0c4de; transition: all .15s; position: relative; margin: auto;
    }
    .mini-cell:hover { background: #1e2e45; color: #fff; }
    .mini-cell.today { border: 1.5px solid #4a6cf7; color: #93c5fd; font-weight: 700; }
    .mini-cell.selected { background: #4a6cf7 !important; color: #fff !important; font-weight: 700; }
    .mini-cell.other-month { color: #2e4060; }
    .mini-cell.weekend { color: #4a6070; }
    .mini-cell.has-event::after {
      content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
      width: 4px; height: 4px; border-radius: 50%; background: #4a6cf7;
    }
    .mini-cell.selected.has-event::after { background: rgba(255,255,255,.7); }

    .day-view { background: #162236; border-radius: 14px; overflow: hidden; }
    .day-header { padding: 16px 20px; border-bottom: 1.5px solid #1e2e45; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .day-nav-btns { display: flex; gap: 6px; }
    .day-nav-btn {
      width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid #2a3d58;
      background: transparent; color: #b0c4de; display: flex; align-items: center;
      justify-content: center; cursor: pointer; transition: all .2s;
    }
    .day-nav-btn:hover { border-color: #4a6cf7; color: #fff; }
    .day-today-btn {
      padding: 6px 14px; border-radius: 16px; border: 1.5px solid #2a3d58;
      background: transparent; color: #b0c4de; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .day-today-btn:hover { border-color: #4a6cf7; color: #fff; }
    .day-title-block { text-align: center; flex: 1; }
    .day-week-num { font-size: 11px; font-weight: 700; color: #4a6cf7; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 2px; }
    .day-name { font-size: 22px; font-weight: 800; line-height: 1.1; }
    .day-name.is-today { color: #4a6cf7; }
    .day-date { font-size: 13px; color: #7090b0; font-weight: 500; margin-top: 2px; }

    .week-strip { display: grid; grid-template-columns: repeat(5,1fr); border-bottom: 1.5px solid #1e2e45; }
    .strip-day {
      padding: 10px 6px; text-align: center; cursor: pointer;
      transition: background .15s; border-right: 1px solid #1a2840; position: relative;
    }
    .strip-day:last-child { border-right: none; }
    .strip-day:hover { background: #1a2d45; }
    .strip-day.active { background: #1e3450; }
    .strip-day.active::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: #4a6cf7; }
    .strip-dow { font-size: 10px; font-weight: 700; color: #4a6070; text-transform: uppercase; letter-spacing: .06em; }
    .strip-num { font-size: 18px; font-weight: 700; color: #fff; line-height: 1.2; margin-top: 2px; }
    .strip-num.today {
      background: #4a6cf7; color: #fff; width: 28px; height: 28px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      margin: 2px auto 0; font-size: 14px;
    }
    .strip-dot { width: 5px; height: 5px; border-radius: 50%; background: #4a6cf7; margin: 3px auto 0; opacity: 0; }
    .strip-dot.visible { opacity: 1; }

    .day-events { padding: 16px 20px; min-height: 240px; }
    .day-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 180px; color: #3a5070; gap: 8px; }
    .day-event-item {
      display: flex; align-items: stretch; background: #111d30; border-radius: 10px;
      overflow: hidden; margin-bottom: 10px; cursor: pointer; transition: box-shadow .2s;
    }
    .day-event-item:hover { box-shadow: 0 2px 16px #0006; }
    .day-event-stripe { width: 5px; flex-shrink: 0; }
    .day-event-body { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
    .day-event-title { font-size: 14px; font-weight: 700; }
    .day-event-meta { font-size: 12px; color: #5a7898; display: flex; flex-wrap: wrap; gap: 10px; }
    .day-event-span { font-size: 11px; color: #4a6cf7; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .day-event-badge { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 10px; align-self: flex-start; margin-top: 2px; }
    .day-event-actions { display: flex; align-items: center; gap: 6px; padding: 0 12px; }

    /* ══════════════════════════════════════════════
       MODAL
    ══════════════════════════════════════════════ */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(8,16,30,.72);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: #162236; border-radius: 20px;
      border: 1.5px solid #1e2e45;
      width: 100%; max-width: 600px;
      max-height: 90vh; overflow: hidden;
      display: flex; flex-direction: column;
      box-shadow: 0 24px 80px #00000080;
      transform: translateY(16px); transition: transform .2s;
    }
    .modal-overlay.open .modal { transform: translateY(0); }

    .modal-header {
      padding: 20px 24px 16px;
      border-bottom: 1.5px solid #1e2e45;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      flex-shrink: 0;
    }
    .modal-header-left { display: flex; flex-direction: column; gap: 4px; }
    .modal-pretitle { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: #4a6cf7; }
    .modal-title { font-size: 18px; font-weight: 800; color: #fff; }
    .modal-subtitle { font-size: 13px; color: #7090b0; margin-top: 2px; }
    .modal-close {
      width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid #2a3d58;
      background: transparent; color: #b0c4de; display: flex; align-items: center;
      justify-content: center; cursor: pointer; flex-shrink: 0; transition: all .2s;
    }
    .modal-close:hover { border-color: #ff5c5c; color: #ff5c5c; }

    .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 20px; }

    /* Search / picker */
    .modal-search {
      display: flex; align-items: center; gap: 8px;
      background: #111d30; border: 1.5px solid #2a3d58;
      border-radius: 12px; padding: 10px 14px;
    }
    .modal-search input { background: transparent; border: none; outline: none; color: #fff; font-size: 14px; flex: 1; }
    .modal-search input::placeholder { color: #4a6070; }

    /* Section label inside modal */
    .modal-section-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .09em; color: #4a6070; margin-bottom: 8px;
    }

    /* Group rows */
    .picker-group { margin-bottom: 4px; }
    .picker-group-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-radius: 10px;
      background: #1e2e45; cursor: pointer;
      transition: background .15s; user-select: none;
    }
    .picker-group-header:hover { background: #243650; }
    .picker-group-left { display: flex; align-items: center; gap: 10px; }
    .picker-group-icon {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .picker-group-name { font-size: 14px; font-weight: 700; color: #fff; }
    .picker-group-count { font-size: 12px; color: #7090b0; }
    .picker-group-right { display: flex; align-items: center; gap: 10px; }

    /* Toggle switch */
    .toggle-wrap { display: flex; align-items: center; gap: 8px; }
    .toggle-label { font-size: 12px; font-weight: 600; color: #7090b0; white-space: nowrap; }
    .toggle {
      position: relative; width: 40px; height: 22px; flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-slider {
      position: absolute; inset: 0; border-radius: 11px;
      background: #2a3d58; cursor: pointer; transition: background .2s;
    }
    .toggle-slider::before {
      content: ''; position: absolute;
      width: 16px; height: 16px; border-radius: 50%;
      background: #fff; left: 3px; top: 3px; transition: transform .2s;
      box-shadow: 0 1px 4px #0004;
    }
    .toggle input:checked + .toggle-slider { background: #4a6cf7; }
    .toggle input:checked + .toggle-slider::before { transform: translateX(18px); }

    /* Expand chevron */
    .group-chevron { color: #4a6070; transition: transform .2s; flex-shrink: 0; }
    .group-chevron.open { transform: rotate(180deg); }

    /* Student list (collapsible) */
    .student-list { display: none; padding: 4px 0 4px 12px; }
    .student-list.open { display: flex; flex-direction: column; gap: 2px; }
    .student-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; border-radius: 8px; transition: background .15s;
    }
    .student-row:hover { background: #1e2e45; }
    .student-left { display: flex; align-items: center; gap: 10px; }
    .student-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .student-name { font-size: 13px; font-weight: 600; color: #c0d4ea; }

    /* Modal footer */
    .modal-footer {
      padding: 14px 24px;
      border-top: 1.5px solid #1e2e45;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      flex-shrink: 0;
    }
    .modal-footer-info { font-size: 12px; color: #7090b0; }
    .modal-footer-info span { color: #4a6cf7; font-weight: 700; }
    .modal-footer-btns { display: flex; gap: 10px; }
    .btn-cancel {
      padding: 9px 20px; border-radius: 10px; border: 1.5px solid #2a3d58;
      background: transparent; color: #b0c4de; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .btn-cancel:hover { border-color: #4a6cf7; color: #fff; }
    .btn-confirm {
      padding: 9px 22px; border-radius: 10px; border: none;
      background: #4a6cf7; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; transition: all .2s;
    }
    .btn-confirm:hover { background: #3a5ce7; box-shadow: 0 2px 12px #4a6cf755; }
  </style>
</head>
<body>

<!-- ══ TOP NAV ══ -->
<nav class="top-nav">
  <div class="top-nav-left">
    <button class="home-btn">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l9-9 9 9M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/>
      </svg>

function renderEfList(){
  const fmt = d => `${d.getDate()}. ${NO_MONTHS_LOW[d.getMonth()]}`;
  document.getElementById('ef-list-container').innerHTML = elevforsider.map(ev=>{
    const spanDays  = Math.round((ev.end-ev.start)/86400000)+1;
    const spanWeeks = Math.round(spanDays/7);
    const spanLabel = spanWeeks>=1?`${spanWeeks} uke${spanWeeks>1?'r':''}`:`${spanDays} dag${spanDays>1?'er':''}`;
    return `
    <div class="ef-list-item">
      <div class="ef-list-stripe" style="background:${ev.color}"></div>
      <div class="ef-list-img"><div class="ef-list-img-ph" style="background:${ev.bg}">${ev.emoji}</div></div>

          <span>${fmt(ev.start)} – ${fmt(ev.end)}</span>
          <span>${spanLabel}</span>

      <div style="padding:0 12px;display:flex;align-items:center;">

════════════════════════════════════ */
function openModal(title){
  currentEFTitle = title;
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-search-input').value = '';
  /* Deep clone groups state */
  modalState = groups.map(g=>({
    ...g,
    on: false,
    expanded: false,
    students: g.students.map(s=>({...s}))
  }));
  renderPickerList(modalState);
  updateActiveCount();
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function handleOverlayClick(e){
  if(e.target === document.getElementById('modal-overlay')) closeModal();
}

function saveModal(){
  // Here you'd persist the state. For demo: just close.
  closeModal();
}

function updateActiveCount(){
  let count = 0;
  modalState.forEach(g=>{
    g.students.forEach(s=>{ if(s.on) count++; });
  });
  document.getElementById('active-count').textContent = count;
}

function setGroupToggle(gIdx, val){
  modalState[gIdx].on = val;
  modalState[gIdx].students.forEach(s => s.on = val);
  renderPickerList(modalState);
  updateActiveCount();
}

function setStudentToggle(gIdx, sIdx, val){
  modalState[gIdx].students[sIdx].on = val;
  // Update group toggle state: on if ALL students on
  modalState[gIdx].on = modalState[gIdx].students.every(s=>s.on);
  renderPickerList(modalState);
  updateActiveCount();
}

function toggleExpand(gIdx){
  modalState[gIdx].expanded = !modalState[gIdx].expanded;
  renderPickerList(modalState);
}

function filterPicker(){
  const q = document.getElementById('modal-search-input').value.toLowerCase();
  if(!q){ renderPickerList(modalState); return; }
  const filtered = modalState.map(g=>{
    const students = g.students.filter(s=>s.name.toLowerCase().includes(q));
    const matchGroup = g.name.toLowerCase().includes(q);
    return { ...g, students: matchGroup ? g.students : students, expanded: true };
  }).filter(g=>g.name.toLowerCase().includes(q)||g.students.length>0);
  renderPickerList(filtered);
}

function renderPickerList(data){
  const list = document.getElementById('picker-list');
  list.innerHTML = '';
  if(data.length===0){
    list.innerHTML='<div style="color:#4a6070;font-size:13px;padding:12px 0">Ingen treff</div>';
    return;
  }
  data.forEach((g, gi)=>{
    // Find real index in modalState
    const realGIdx = modalState.findIndex(x=>x.id===g.id);

    const wrap = document.createElement('div'); wrap.className='picker-group';

    /* Header */
    const hdr = document.createElement('div'); hdr.className='picker-group-header';
    hdr.innerHTML = `
      <div class="picker-group-left">
        <div class="picker-group-icon" style="background:${g.color}">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </div>
        <div>
          <div class="picker-group-name">${g.name}</div>
          <div class="picker-group-count">${g.students.length} elever</div>
        </div>
      </div>
      <div class="picker-group-right">
        <div class="toggle-wrap">
          <span class="toggle-label">Skru på elevforside</span>
          <label class="toggle" onclick="event.stopPropagation()">
            <input type="checkbox" ${g.on?'checked':''} onchange="setGroupToggle(${realGIdx},this.checked)"/>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" width="16" height="16"
             class="group-chevron ${g.expanded?'open':''}">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </div>`;
    hdr.addEventListener('click', ()=>toggleExpand(realGIdx));
    wrap.appendChild(hdr);

    /* Students */
    const slist = document.createElement('div');
    slist.className='student-list'+(g.expanded?' open':'');
    g.students.forEach((s, si)=>{
      const realSIdx = modalState[realGIdx].students.findIndex(x=>x.id===s.id);
      const row = document.createElement('div'); row.className='student-row';
      row.innerHTML=`
        <div class="student-left">
          <div class="student-avatar" style="background:${s.color}">${s.initials}</div>
          <div class="student-name">${s.name}</div>
        </div>
        <div class="toggle-wrap">
          <span class="toggle-label">Skru på elevforside</span>
          <label class="toggle">
            <input type="checkbox" ${s.on?'checked':''}
              onchange="setStudentToggle(${realGIdx},${realSIdx},this.checked)"/>
            <span class="toggle-slider"></span>
          </label>
        </div>`;
      slist.appendChild(row);
    });
    wrap.appendChild(slist);
    list.appendChild(wrap);
  });
}

/* ════════════════════════════════════
   CALENDAR
════════════════════════════════════ */
function isoWeek(d){
  const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  dt.setUTCDate(dt.getUTCDate()+4-(dt.getUTCDay()||7));
  const y0=new Date(Date.UTC(dt.getUTCFullYear(),0,1));
  return Math.ceil((((dt-y0)/86400000)+1)/7);
}
function sameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function weekMonday(d){ const day=d.getDay(); const diff=day===0?-6:1-day; const m=new Date(d); m.setDate(d.getDate()+diff); m.setHours(0,0,0,0); return m; }

let selectedDay = new Date(TODAY);
let pickerMonth = new Date(TODAY.getFullYear(),TODAY.getMonth(),1);

function eventsOnDay(date){ return elevforsider.filter(ev=>date>=ev.start&&date<=ev.end); }
function hasEvent(date){ return eventsOnDay(date).length>0; }

function renderMiniMonth(){
  const yr=pickerMonth.getFullYear(), mo=pickerMonth.getMonth();
  document.getElementById('picker-title').textContent=`${NO_MONTHS[mo]} ${yr}`;
  const grid=document.getElementById('mini-grid'); grid.innerHTML='';
  ['M','T','O','T','F','L','S'].forEach(l=>{ const h=document.createElement('div'); h.className='mini-dow'; h.textContent=l; grid.appendChild(h); });
  const first=new Date(yr,mo,1); let startDow=first.getDay(); startDow=startDow===0?6:startDow-1;
  const dim=new Date(yr,mo+1,0).getDate(); const prevDim=new Date(yr,mo,0).getDate();
  for(let i=0;i<startDow;i++){ const c=document.createElement('div'); c.className='mini-cell other-month'; c.textContent=prevDim-startDow+1+i; grid.appendChild(c); }
  for(let day=1;day<=dim;day++){
    const date=new Date(yr,mo,day); const dow=date.getDay(); const weekend=dow===0||dow===6;
    const isTod=sameDay(date,TODAY); const isSel=sameDay(date,selectedDay); const hasEv=hasEvent(date);
    const c=document.createElement('div');
    let cls='mini-cell'; if(weekend)cls+=' weekend'; if(isTod)cls+=' today'; if(isSel)cls+=' selected'; if(hasEv)cls+=' has-event';
    c.className=cls; c.textContent=day;
    c.addEventListener('click',()=>{ selectedDay=date; renderDayView(); renderMiniMonth(); });
    grid.appendChild(c);
  }
  const trail=(startDow+dim)%7===0?0:7-(startDow+dim)%7;
  for(let i=1;i<=trail;i++){ const c=document.createElement('div'); c.className='mini-cell other-month'; c.textContent=i; grid.appendChild(c); }
}

function changePickerMonth(dir){ pickerMonth.setMonth(pickerMonth.getMonth()+dir); renderMiniMonth(); }

function renderDayView(){
  const isTod=sameDay(selectedDay,TODAY);
  const wk=isoWeek(selectedDay); const dow=selectedDay.getDay();
  document.getElementById('day-week-num').textContent=`Uke ${wk}`;
  const nameEl=document.getElementById('day-name');
  nameEl.textContent=NO_DAYS_FULL[dow]; nameEl.className='day-name'+(isTod?' is-today':'');
  document.getElementById('day-date').textContent=`${selectedDay.getDate()}. ${NO_MONTHS_LOW[selectedDay.getMonth()]} ${selectedDay.getFullYear()}`;
  renderWeekStrip(); renderDayEvents();
  const yr=selectedDay.getFullYear(),mo=selectedDay.getMonth();
  if(pickerMonth.getFullYear()!==yr||pickerMonth.getMonth()!==mo){ pickerMonth=new Date(yr,mo,1); }
  renderMiniMonth();
}

function renderWeekStrip(){
  const mon=weekMonday(selectedDay); const strip=document.getElementById('week-strip'); strip.innerHTML='';
  for(let i=0;i<5;i++){
    const date=addDays(mon,i); const dow=date.getDay();
    const isTod=sameDay(date,TODAY); const isSel=sameDay(date,selectedDay); const hasEv=hasEvent(date);
    const cell=document.createElement('div'); cell.className='strip-day'+(isSel?' active':'');
    const numHtml=isTod?`<div class="strip-num today">${date.getDate()}</div>`:`<div class="strip-num">${date.getDate()}</div>`;
    cell.innerHTML=`<div class="strip-dow">${NO_DAYS_SHORT[dow]}</div>${numHtml}<div class="strip-dot${hasEv?' visible':''}"></div>`;
    cell.addEventListener('click',()=>{ selectedDay=date; renderDayView(); });
    strip.appendChild(cell);
  }
}

function renderDayEvents(){
  const events=eventsOnDay(selectedDay); const c=document.getElementById('day-events'); c.innerHTML='';
  if(events.length===0){ c.innerHTML=`<div class="day-empty"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="36" height="36"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg><p>Ingen elevforsider denne dagen</p></div>`; return; }
  events.forEach(ev=>{
    const spanDays=Math.round((ev.end-ev.start)/86400000)+1; const spanWeeks=Math.round(spanDays/7);
    const spanLabel=spanWeeks>=1?`${spanWeeks} uke${spanWeeks>1?'r':''}`:`${spanDays} dag${spanDays>1?'er':''}`;
    const fmt=d=>`${d.getDate()}. ${NO_MONTHS_LOW[d.getMonth()]}`;
    const item=document.createElement('div'); item.className='day-event-item';
    item.innerHTML=`
      <div class="day-event-stripe" style="background:${ev.color}"></div>
      <div class="day-event-body">
        <div class="day-event-title">${ev.emoji} ${ev.title}</div>
        <div class="day-event-meta"><span>Gruppe: ${ev.group}</span><span>${fmt(ev.start)} – ${fmt(ev.end)}</span></div>
        <div class="day-event-span">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="11" height="11"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          Varighet: ${spanLabel}
        </div>
        <div class="day-event-badge" style="background:${ev.color}22;color:${ev.color}">${ev.badge}</div>
      </div>
      <div class="day-event-actions">${eyeBtn()} ${trashBtn()}</div>`;
    c.appendChild(item);
  });
}

function changeDay(dir){
  let next=addDays(selectedDay,dir);
  while(next.getDay()===0||next.getDay()===6) next=addDays(next,dir);
  selectedDay=next; renderDayView();
}
function goToday(){ selectedDay=new Date(TODAY); pickerMonth=new Date(TODAY.getFullYear(),TODAY.getMonth(),1); renderDayView(); }

/* ════════════════════════════════════
   TAB / VIEW SWITCHES
════════════════════════════════════ */
function switchMainTab(btn){ document.querySelectorAll('.main-tab').forEach(t=>t.classList.remove('active')); btn.classList.add('active'); }
function switchSubTab(btn,id){ document.querySelectorAll('.sub-tab').forEach(t=>t.classList.remove('active')); btn.classList.add('active'); document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function switchFilter(btn){ btn.closest('.filter-tabs').querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active')); btn.classList.add('active'); }
function switchView(view){
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.view-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('btn-'+view==='calendar'?'cal':'list').classList.add('active');
  document.getElementById('view-'+view).classList.add('active');
  // Cleaner logic:
  const btnId = view==='calendar' ? 'btn-cal' : 'btn-list';
  document.getElementById(btnId).classList.add('active');
  if(view==='calendar'){ renderMiniMonth(); renderDayView(); }
}
