<!DOCTYPE html>
<html lang="nob">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eksempler og testing</title>

    <link rel="stylesheet" type="text/css" href="style.css">

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 400px;
        margin: 40px auto;
        padding: 0 20px;
      }

      #link-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      #link-list li a {
        display: block;
        padding: 10px 16px;
        margin: 6px 0;
        text-decoration: none;
        color: #2c6fad;
        background-color: #f0f4f8;
        border-radius: 6px;
        border-left: 4px solid #2c6fad;
        transition: background-color 0.2s, color 0.2s;
      }

      #link-list li a:hover {
        background-color: #2c6fad;
        color: #fff;
      }
    </style>
  </head>
  <body>

    <ul id="link-list">
      <li><a href="ukensuu.html">ukensUU</a></li>
      <li><a href="plassering.html">Plassering</a></li>
      
      <li><a href="elevforside.html">Elevforside</a></li>
      
      <li><a href="utdeling.html">Utdeling</a></li>
    </ul>

    <script>
      const list = document.getElementById("link-list");
      const items = Array.from(list.querySelectorAll("li"));

      items
        .sort((a, b) =>
          a.querySelector("a").textContent.localeCompare(
            b.querySelector("a").textContent,
            "nob",
            { sensitivity: "base" }
          )
        )
        .forEach(item => list.appendChild(item));
    </script>

  </body>
</html>
